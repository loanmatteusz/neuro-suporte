services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neuro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro"]
      interval: 5s
      retries: 10

  minio:
    image: chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neuro
      MINIO_ROOT_PASSWORD: neuro-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 neuro neuro-secret &&
      mc mb --ignore-existing local/neuro-suporte &&
      mc anonymous set none local/neuro-suporte
      "

volumes:
  postgres_data:
  minio_data:
